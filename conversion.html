<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Number Base Converter</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 1.2s ease;
    }
    body::before {
      content: "";
      background-image: url('p.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 400px;
      animation: popIn 0.9s ease-out;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
      animation: floatText 3s ease-in-out infinite;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      background: #f9f9f9;
      transition: 0.3s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #00c9ff;
      box-shadow: 0 0 10px #00c9ff55;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .result {
      display: none;
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
      color: #333;
      animation: fadeUp 0.6s ease-in;
      padding: 10px;
      background: #f3f3f3;
      border-radius: 8px;
    }
    .error {
      color: red;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes floatText {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    select, input[type="text"] {
    width: 100%; /* Ensures both fields are the same width */
    padding: 12px;
    margin: 12px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    transition: 0.3s ease;
    box-sizing: border-box; /* Ensures padding is included in the width */
}
  </style>
</head>
<body>
  <div class="container">
    <h2>Number Base Converter</h2>
    <input type="text" id="number" placeholder="Enter a number" />
    <select id="fromBase" aria-label="Convert from base">
      <option value="2">Binary</option>
      <option value="8">Octal</option>
      <option value="10" selected>Decimal</option>
      <option value="16">Hexadecimal</option>
    </select>
    <select id="toBase" aria-label="Convert to base">
      <option value="2">Binary</option>
      <option value="8">Octal</option>
      <option value="10">Decimal</option>
      <option value="16" selected>Hexadecimal</option>
    </select>
    <button onclick="convert()">Convert</button>
    <div id="result" class="result"></div>
  </div>
  <script>
    function convert() {
      const input = document.getElementById("number").value.trim();
      const fromBase = parseInt(document.getElementById("fromBase").value);
      const toBase = parseInt(document.getElementById("toBase").value);
      const resultDiv = document.getElementById("result");
      if (!input.match(/^[0-9a-fA-F]+$/)) {
        resultDiv.innerHTML = `<span class="error">Invalid number format.</span>`;
        resultDiv.style.display = "block";
        return;
      }
      try {
        const decimal = BigInt(`0x${parseInt(input, fromBase).toString(16)}`);
        const converted = decimal.toString(toBase).toUpperCase();
        resultDiv.innerHTML = `<strong>Converted Result:</strong> ${converted}`;
      } catch (err) {
        resultDiv.innerHTML = `<span class="error">Conversion error: ${err.message}</span>`;
      }
      resultDiv.style.display = "block";
    }
    // Hide result on input change
    document.getElementById("number").addEventListener("input", () => {
      document.getElementById("result").style.display = "none";
    });
  </script>
</body>
</html>
