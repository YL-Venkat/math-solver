
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Solver - Operations</title>
    <script defer src="op.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        select, input[type="number"] {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
            height: 38px; /* Same height for both input and dropdown */
            box-sizing: border-box; /* Ensures padding and border are included in the width/height */
        }

        input[type="number"]::placeholder {
            text-align: center; /* Centering the placeholder text */
        }

        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #45a049;
        }

        .result {
            margin-top: 20px;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
  <h2>Arithmetic-Operations</h2>

  <label for="operation">Choose an operation:</label>
  <select id="operation">
    <option value="add">Addition</option>
    <option value="subtract">Subtraction</option>
    <option value="multiply">Multiplication</option>
    <option value="divide">Division</option>
    <option value="modulus">Modular Division</option>
    <option value="factorial">Factorial</option>
    <option value="prime">Prime Check</option>
    <option value="fibonacci">Fibonacci Series</option>
    <option value="gcd">Greatest Common Divisor (GCD)</option>
  </select>

  <br>

  <input type="number" id="num1" placeholder="Enter first number">
  <input type="number" id="num2" placeholder="Enter second number">

  <br>

  <button onclick="solve()">Solve</button>

  <br><br>

  <div id="result"></div>

</div>

</body>
</html>
