<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Solver</title>

  <!-- External Auth Libraries & Auth Guard -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="ag.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.5s ease-in-out;
      overflow: hidden;
    }

    body::before {
      content: "";
      background-image: url('op.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(270deg, #00f2ff, #ff00ff, #00ff99, #ffcc00);
      background-size: 800% 800%;
      color: transparent;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: animatedGradient 6s ease infinite, floatUpDown 3s ease-in-out infinite;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
      text-align: center;
    }

    .c1 {
      padding: 60px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.3),
        0 0 35px rgba(255, 0, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(0, 0, 0, 0.2);
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .operation-button {
      flex: 1;
      position: relative;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
      z-index: 1;
      animation: floatEase 6s ease-in-out infinite alternate;
    }

    .operation-button:hover {
      transform: translateY(-6px) scale(1.04);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25),
        0 0 12px #00f2ff, 0 0 22px #9b00ff;
      background: linear-gradient(90deg, #ffffff22, #ffffff66, #ffffff22);
      background-size: 200% auto;
      animation: shimmer 1.5s linear infinite, floatEase 6s ease-in-out infinite alternate;
      color: white;
    }

    .operation-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
      height: 300%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 10%, transparent 10.01%);
      background-repeat: no-repeat;
      background-position: center;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.5s, opacity 1s;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    .operation-button:hover::before {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .operation-button::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      padding: 1px;
      background: linear-gradient(135deg, #00f2ff, #9b00ff);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 0;
    }

    .operation-button:hover::after {
      opacity: 1;
    }

    .extra-button-row {
      max-width: 500px;
      margin: 0 auto;
      margin-top: 20px;
    }

    .extra-button-row .operation-button {
      width: 100%;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes animatedGradient {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes floatUpDown {
      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes floatEase {
      0% {
        transform: translateY(0px);
      }

      100% {
        transform: translateY(-6px);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      pointer-events: none;
      z-index: -1;
      background-image: radial-gradient(white 1px, transparent 0),
        radial-gradient(white 1px, transparent 0);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      opacity: 0.03;
      animation: floatDots 30s linear infinite;
    }

    @keyframes floatDots {
      from {
        background-position: 0 0, 20px 20px;
      }

      to {
        background-position: 100px 100px, 120px 120px;
      }
    }
  </style>
</head>

<body>
  <div class="c1">
    <h1>Choose a Math Operation</h1>

    <div class="button-row">
      <button class="operation-button" onclick="window.location.href='pf.html'">Prime Factorization</button>
      <button class="operation-button" onclick="window.location.href='cc.html'">Caesar Cipher</button>
    </div>

    <div class="button-row">
      <button class="operation-button" onclick="window.location.href='sc.html'">Shift Cipher</button>
      <button class="operation-button" onclick="window.location.href='ac.html'">Affine Cipher</button>
    </div>

    <div class="button-row">
      <button class="operation-button" onclick="window.location.href='dc.html'">Digraphic Cipher</button>
      <button class="operation-button" onclick="window.location.href='ld.html'">Last Digits Of Expansion</button>
    </div>

    <div class="extra-button-row">
      <button class="operation-button" onclick="window.location.href='needmore.html'">Need More</button>
    </div>

  </div>

  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>

</html>
