<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Euler's Totient Function</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      animation: fadeIn 1.2s ease;
    }

    input::placeholder {
      color: #888;
      font-style: italic;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0.9;
      animation: pulsePlaceholder 3s ease-in-out infinite;
    }

    input:focus::placeholder {
      transform: translateX(5px);
      opacity: 0.5;
    }

    @keyframes pulsePlaceholder {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 340px;
      position: relative;
      overflow: hidden;
      animation: popIn 0.9s ease-out;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, #00c9ff55, transparent 70%);
      animation: rotateBG 12s linear infinite;
      z-index: 0;
      opacity: 0.1;
    }

    .container * {
      position: relative;
      z-index: 1;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
      animation: floatText 3s ease-in-out infinite;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
      background: #f9f9f9;
      transition: 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #00c9ff;
      box-shadow: 0 0 10px #00c9ff55;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .result {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
      color: #333;
      animation: fadeUp 0.6s ease-in;
    }

    .error {
      color: red;
    }

    .result-hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes floatText {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rotateBG {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    body::before {
      content: "";
      background-image: url('p.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

  </style>
</head>
<body>

  <div class="container">
    <h2>Euler's Totient Function (φ)</h2>
    <input type="text" id="num" placeholder="Enter a number" />
    <button onclick="calculateTotient()">Calculate φ(n)</button>
    <div id="result" class="result result-hidden"></div>
  </div>

  <script>
    function calculateTotient() {
      const input = document.getElementById("num").value.trim();
      const resultArea = document.getElementById("result");

      // Hide result initially
      resultArea.classList.add("result-hidden");

      if (!input || !/^\d+$/.test(input)) {
        resultArea.innerHTML = `<span class="error">Please enter a valid positive integer.</span>`;
        resultArea.classList.remove("result-hidden");
        return;
      }

      let n = BigInt(input);
      let original = n;
      let result = n;

      for (let p = 2n; p * p <= n; p++) {
        if (n % p === 0n) {
          while (n % p === 0n) {
            n = n / p;
          }
          result = result * (p - 1n) / p;
        }
      }

      if (n > 1n) {
        result = result * (n - 1n) / n;
      }

      resultArea.innerHTML = `φ(${original}) = <strong>${result.toString()}</strong>`;
      resultArea.style.display = "block";
    }
  </script>

</body>
</html>
