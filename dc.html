<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digraphic Cipher Tool</title>
  <style>
html, body {
  height: 100%;
  margin: 0;
  overflow:hidden; /* 🚫 Disable scrolling for main page */
}
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #00c9ff, #92fe9d);
  display: flex;
  justify-content: center;
  align-items: center;
  animation: fadeIn 1.2s ease;
}
    body::before {
      content: "";
      background-image: url('p.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 400px;
      position: relative;
      animation: popIn 0.9s ease-out;
    }
    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, #00c9ff55, transparent 70%);
      z-index: 0;
      opacity: 0.1;
    }
    .container * {
      position: relative;
      z-index: 1;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
      animation: floatText 3s ease-in-out infinite;
    }
    textarea, input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
      background: #f9f9f9;
      transition: 0.3s ease;
    }
    textarea {
      resize: none;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #00c9ff;
      box-shadow: 0 0 10px #00c9ff55;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .result {
      display: none;
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
      color: #333;
      animation: fadeUp 0.6s ease-in;
      background: #f3f3f3;
      padding: 12px;
      border-radius: 8px;
      text-align: left;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .modal {
      display: none; /* hidden by default */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      /* Use flex to center content when shown */
      justify-content: center;
      align-items: center;
      padding: 40px;
      box-sizing: border-box;
    }
    .modal-content {
      position: relative;
      background-color: #fff;
      width: 100%;
      max-width: 660px;
      height: auto;
      max-height: 660px;
      padding: 30px;
      border-radius: 12px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.4;
      color: #222;
      animation: popIn 0.3s ease;
      box-sizing: border-box;
    }
    .close {
      color: #aaa;
      position: absolute;
      top: 10px;
      right: 16px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close:hover,
    .close:focus {
      color: #000;
    }
    .nav-controls {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}
.nav-controls button {
  width: 120px;
  font-weight: bold;
}
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes floatText {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <!-- Load MathJax -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="container">
    <h2>Digraphic Cipher Tool</h2>
    <textarea id="sentence" rows="3" placeholder="Enter your sentence..."></textarea>
    <input id="a1" type="number" placeholder="Enter value for a1 (ex:3)" />
    <input id="b1" type="number" placeholder="Enter value for b1 (ex:10)" />
    <input id="a2" type="number" placeholder="Enter value for a2 (ex:9)" />
    <input id="b2" type="number" placeholder="Enter value for b2 (ex:7)" />
    <select id="mode" aria-label="Mode (encrypt or decrypt)" title="Mode: encrypt or decrypt">
      <option value="encrypt">Encrypt</option>
      <option value="decrypt">Decrypt</option>
    </select>
    <button onclick="runDigraphic()">Run Digraphic Cipher</button>
    <button onclick="showFullProcess()">Full Process</button>
    <div id="result" class="result"></div>
  </div>
  <!-- Modal Window -->
  <div id="fullProcessModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content" tabindex="0">
      <span class="close" onclick="closeModal()" aria-label="Close">&times;</span>
      <h3 id="modalTitle">Full Process</h3>
      <div id="fullProcessContent">Loading...</div>
    </div>
  </div>
<script>
  function mod(n, m) {
    return ((n % m) + m) % m;
  }
  function modInverse(a, m) {
    a = mod(a, m);
    for (let x = 1; x < m; x++) {
      if ((a * x) % m === 1) return x;
    }
    return null;
  }
  function digraphicCipher(str, a1, b1, a2, b2, mode) {
    const m = 26;
    const result = [];
    str = str.toUpperCase().replace(/[^A-Z]/g, '');
    if (str.length % 2 !== 0) str += 'X';
    if (mode === "encrypt") {
      for (let i = 0; i < str.length; i += 2) {
        let p1 = str.charCodeAt(i) - 65;
        let p2 = str.charCodeAt(i + 1) - 65;
        let c1 = mod((a1 * p1 + b1 * p2), m);
        let c2 = mod((a2 * p1 + b2 * p2), m);
        result.push(String.fromCharCode(c1 + 65));
        result.push(String.fromCharCode(c2 + 65));
      }
    } else if (mode === "decrypt") {
      let det = a1 * b2 - a2 * b1;
      let detInv = modInverse(det, m);
      if (detInv === null) return "Invalid: Matrix is not invertible mod 26.";
      let a1_inv = mod(detInv * b2, m);
      let b1_inv = mod(-detInv * b1, m);
      let a2_inv = mod(-detInv * a2, m);
      let b2_inv = mod(detInv * a1, m);
      for (let i = 0; i < str.length; i += 2) {
        let c1 = str.charCodeAt(i) - 65;
        let c2 = str.charCodeAt(i + 1) - 65;
        let p1 = mod(a1_inv * c1 + b1_inv * c2, m);
        let p2 = mod(a2_inv * c1 + b2_inv * c2, m);
        result.push(String.fromCharCode(p1 + 65));
        result.push(String.fromCharCode(p2 + 65));
      }
    }
    return result.join('');
  }
  function runDigraphic() {
    const sentence = document.getElementById("sentence").value.trim().replace(/[^A-Za-z]/g, '');
    const a1 = parseInt(document.getElementById("a1").value);
    const b1 = parseInt(document.getElementById("b1").value);
    const a2 = parseInt(document.getElementById("a2").value);
    const b2 = parseInt(document.getElementById("b2").value);
    const mode = document.getElementById("mode").value;
    const resultDiv = document.getElementById("result");
    if (!sentence) {
      resultDiv.textContent = "Please enter a sentence.";
      resultDiv.style.display = "block";
      return;
    }
    if (isNaN(a1) || isNaN(b1) || isNaN(a2) || isNaN(b2)) {
      resultDiv.textContent = "Please enter valid numbers for a1, b1, a2, and b2.";
      resultDiv.style.display = "block";
      return;
    }
    const result = digraphicCipher(sentence, a1, b1, a2, b2, mode);
    resultDiv.innerHTML = `<strong>Result:</strong>\n${result}`;
    resultDiv.style.display = "block";
  }
function showFullProcess() {
  const sentenceRaw = document.getElementById("sentence").value.trim();
  const a1 = parseInt(document.getElementById("a1").value);
  const b1 = parseInt(document.getElementById("b1").value);
  const a2 = parseInt(document.getElementById("a2").value);
  const b2 = parseInt(document.getElementById("b2").value);
  const mode = document.getElementById("mode").value;
  const m = 26;
  if (!sentenceRaw) {
    alert("Please enter a sentence before viewing full process.");
    return;
  }
  if ([a1, b1, a2, b2].some(x => isNaN(x))) {
    alert("Please enter valid numbers for a1, b1, a2, and b2.");
    return;
  }
  let str = sentenceRaw.toUpperCase().replace(/[^A-Z]/g, '');
  if (str.length % 2 !== 0) str += 'X';
  // Create the static header part of the explanation
  let header = `
<p style="color: black; font-weight: bold;">Given,</p>
\\[
\\begin{aligned}
\\mathbf{c}_1 &= ${a1} \\mathbf{p}_1 + ${b1} \\mathbf{p}_2\\kern-1em\\pmod{26} \\\\[15pt]
\\mathbf{c}_2 &= ${a2} \\mathbf{p}_1 + ${b2} \\mathbf{p}_2\\kern-1em\\pmod{26}
\\end{aligned}
\\]
<p style="text-align: center; font-weight: bold;">
Given message is ${sentenceRaw}
<br style="line-height: 10;">
Convert message into digraphs:
</p>
${(() => {
  let pairs = [];
  for (let i = 0; i < str.length; i += 2) {
    pairs.push([str[i], str[i + 1]]);
  }
  const pad = (s) => s.toString().padStart(2, ' '); 
  const lettersLine = pairs.map(p => `${pad(p[0])} ${pad(p[1])}`).join('     ');
  const numbersLine = pairs
    .map(p => `${pad(p[0].charCodeAt(0) - 65)} ${pad(p[1].charCodeAt(0) - 65)}`)
    .join('     ');
  return `<pre style="font-family: 'Courier New', monospace; text-align: center; font-size: 16px; font-weight: bold;">${lettersLine}\n${numbersLine}</pre>`;
})()}
`;
const firstPageSize = 5;
const chunkSize = 6;
const pairsCount = str.length / 2;
const remainingPairs = pairsCount - firstPageSize;
const totalPages = 1 + Math.ceil(Math.max(0, remainingPairs) / chunkSize);
  // Prepare detailed pairs explanations array
  let detailedPairs = [];
  if (mode === "encrypt") {
      detailedPairs.push(`
    <p style="font-weight: bold; ">For Encryption:</p>
    <p style="font-weight: bold; text-align: center;">C ≡ AP (mod 26)</p>
  `);
    // Encryption explanations for each pair
    for (let i = 0; i < str.length; i += 2) {
      let p1 = str.charCodeAt(i) - 65;
      let p2 = str.charCodeAt(i + 1) - 65;
      let c1Raw = a1 * p1 + b1 * p2;
      let c2Raw = a2 * p1 + b2 * p2;
      let c1 = ((c1Raw % m) + m) % m;
      let c2 = ((c2Raw % m) + m) % m;
      let l1 = str[i];
      let l2 = str[i + 1];
      let cipherChar1 = String.fromCharCode(c1 + 65);
      let cipherChar2 = String.fromCharCode(c2 + 65);
detailedPairs.push(`
<p><strong>For ${l1} ${l2}:</strong></p>
\\[
\\begin{array}{rl}
\\mathbf{P} &= \\begin{bmatrix} ${p1} \\\\ ${p2} \\end{bmatrix} \\\\[15pt]
\\begin{bmatrix} c_1 \\\\ c_2 \\end{bmatrix} &\\equiv 
\\begin{bmatrix} ${a1} & ${b1} \\\\ ${a2} & ${b2} \\end{bmatrix} 
\\begin{bmatrix} ${p1} \\\\ ${p2} \\end{bmatrix} \\pmod{26} \\\\[15pt]
\\begin{bmatrix} c_1 \\\\ c_2 \\end{bmatrix} &\\equiv 
\\begin{bmatrix} ${a1} \\times ${p1} + ${b1} \\times ${p2} \\\\ ${a2} \\times ${p1} + ${b2} \\times ${p2} \\end{bmatrix} \\pmod{26} \\\\[15pt]
\\begin{bmatrix} c_1 \\\\ c_2 \\end{bmatrix} &\\equiv 
\\begin{bmatrix} ${a1 * p1} + ${b1 * p2} \\\\ ${a2 * p1} + ${b2 * p2} \\end{bmatrix} \\pmod{26} \\\\[15pt]
\\begin{bmatrix} c_1 \\\\ c_2 \\end{bmatrix} &\\equiv 
\\begin{bmatrix} ${c1Raw} \\\\ ${c2Raw} \\end{bmatrix} \\pmod{26} \\\\[15pt]
\\begin{bmatrix} c_1 \\\\ c_2 \\end{bmatrix} &\\equiv 
\\begin{bmatrix} ${c1} \\\\ ${c2} \\end{bmatrix} \\pmod{26} \\\\[15pt]
&${c1} \\quad ${c2} \\\\
&${cipherChar1} \\quad ${cipherChar2}
\\end{array}
\\]
`);
}
const finalText = digraphicCipher(sentenceRaw, a1, b1, a2, b2, 'encrypt');
detailedPairs.push(`
<hr>
<p style="text-align: center; font-weight: bold; margin-top: 20px; color: blue;">
\\[
\\therefore\\quad\\text{Final ciphered text is -}\\quad \\texttt{${finalText}}
\\]
</p>
`);
  } else if (mode === "decrypt") {
    // Decryption inverse matrix calculations
    let det = a1 * b2 - a2 * b1;
    let detInv = modInverse(det, m);
    if (detInv === null) {
      alert("Matrix is not invertible modulo 26, so decryption is impossible.");
      return;
    }
    let a1_inv = ((detInv * b2) % m + m) % m;
    let b1_inv = ((-detInv * b1) % m + m) % m;
    let a2_inv = ((-detInv * a2) % m + m) % m;
    let b2_inv = ((detInv * a1) % m + m) % m;
    header += `
Determinant:
\\[
\\det(A) = (${a1} \\times ${b2}) - (${a2} \\times ${b1}) = ${det}
\\]
Inverse of determinant mod 26:
\\[
\\det(A)^{-1} \\equiv ${detInv} \\pmod{26}
\\]
Inverse matrix \\( A^{-1} \\) modulo 26:
\\[
A^{-1} = \\det(A)^{-1} 
\\times 
\\begin{bmatrix}
${b2} & ${-b1} \\\\
${-a2} & ${a1}
\\end{bmatrix}
\\equiv
\\begin{bmatrix}
${a1_inv} & ${b1_inv} \\\\
${a2_inv} & ${b2_inv}
\\end{bmatrix}
\\pmod{26}
\\]
Decrypting each ciphertext pair using:
\\[
\\begin{bmatrix}
p_1 \\\\
p_2
\\end{bmatrix}
=
A^{-1} 
\\times
\\begin{bmatrix}
c_1 \\\\
c_2
\\end{bmatrix}
\\pmod{26}
\\]
Calculate plaintext pairs:
\\[
\\begin{aligned}
`;
    for (let i = 0; i < str.length; i += 2) {
      let c1 = str.charCodeAt(i) - 65;
      let c2 = str.charCodeAt(i + 1) - 65;
      let p1 = ((a1_inv * c1 + b1_inv * c2) % m + m) % m;
      let p2 = ((a2_inv * c1 + b2_inv * c2) % m + m) % m;
      detailedPairs.push(`\\[
      \\begin{bmatrix} ${p1} \\\\ ${p2} \\end{bmatrix} = 
\\begin{bmatrix} ${a1_inv} & ${b1_inv} \\\\ ${a2_inv} & ${b2_inv} \\end{bmatrix} 
\\times 
\\begin{bmatrix} ${c1} \\\\ ${c2} \\end{bmatrix} 
\\equiv 
\\begin{bmatrix} ${p1} \\\\ ${p2} \\end{bmatrix} \\pmod{26} \\\\
\\text{Plain letters: } ${String.fromCharCode(p1 + 65)} ${String.fromCharCode(p2 + 65)}\\]
`);
    }
    header += `\\end{aligned}
\\]
Final plaintext: \\texttt{${digraphicCipher(sentenceRaw, a1, b1, a2, b2, 'decrypt')}}
`;
  }
   let currentPage = 1;
  // Create navigation controls inside modal
  const modalContent = document.querySelector('#fullProcessModal .modal-content');
  // Clear existing nav if any
  let existingNav = modalContent.querySelector('.nav-controls');
  if (existingNav) existingNav.remove();
  const navControls = document.createElement('div');
  navControls.classList.add('nav-controls');
  navControls.style.margin = '10px 0';
  navControls.style.textAlign = 'center';
  const prevBtn = document.createElement('button');
  prevBtn.textContent = 'Previous';
  prevBtn.disabled = true;
  prevBtn.style.marginRight = '10px';
  const nextBtn = document.createElement('button');
  nextBtn.textContent = 'Next';
  navControls.appendChild(prevBtn);
  navControls.appendChild(nextBtn);
  // Insert nav controls after modal title but before content
  const fullProcessContent = document.getElementById('fullProcessContent');
  modalContent.appendChild(navControls);
  function renderPage(page) {
    currentPage = page;
    const start = (page - 1) * chunkSize;
    const end = Math.min(start + chunkSize, detailedPairs.length);
    let pagePairsLaTeX = detailedPairs.slice(start, end).join('\n');
    let pageContent = '';
    if (page === 1) {
      pageContent = header + "\n" + pagePairsLaTeX;
    } else {
      pageContent = pagePairsLaTeX;
    }
    fullProcessContent.innerHTML = pageContent;
    MathJax.typesetPromise().then(() => {
      // Scroll modal content to top when page changes
      modalContent.scrollTop = 0;
    });
    // Enable/disable buttons
    prevBtn.disabled = (page === 1);
    nextBtn.disabled = (page === totalPages);
  }
  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) renderPage(currentPage - 1);
  });
  nextBtn.addEventListener('click', () => {
    if (currentPage < totalPages) renderPage(currentPage + 1);
  });
  // Show the modal
  const fullProcessModal = document.getElementById('fullProcessModal');
  fullProcessModal.style.display = 'flex';
  // Render the first page
  renderPage(1);
}
window.addEventListener("click", function(event) {
  const modal = document.getElementById("fullProcessModal");
  if (event.target === modal) {
    modal.style.display = "none";
  }
});
// Close modal with Escape key
document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    document.getElementById("fullProcessModal").style.display = "none";
  }
});
function closeModal() {
  document.getElementById("fullProcessModal").style.display = "none";
}
</script>
</body>
</html>
