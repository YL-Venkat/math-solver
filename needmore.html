<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Solver WIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    /* Entire page entrance animation */
    
    #page-wrapper {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeSlideIn 1.5s ease-out forwards;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bgimage {
      background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url("help.jpg") no-repeat center center;
      background-size: cover;
      width: 100%;
      height: 100vh;
    }

    header {
      background-color: rgba(51, 51, 51, 0.8);
      color: #fff;
      padding: 1rem 0;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
      position: relative;
      z-index: 1;
    }

    .wip-note {
      margin: 0 auto;
      font-size: 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 18px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: floatSubtle 3s ease-in-out infinite;
      max-width: 100%;
      text-align: center;
      height: 80px;
    }

    nav {
      margin: 1rem 0;
      text-align: center;
      animation: slideDown 2s ease-in-out;
      position: relative;
      z-index: 1;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #fff;
      opacity: 0;
      animation: fadeInLinks 2s ease-in-out forwards;
    }

    nav a:nth-child(1) { animation-delay: 0.5s; }
    nav a:nth-child(2) { animation-delay: 1s; }
    nav a:nth-child(3) { animation-delay: 1.5s; }

    nav a:hover {
      color: #007BFF;
    }

    main {
      padding: 2rem;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 2s ease-in-out forwards;
      animation-delay: 2s;
      color: white;
      position: relative;
      z-index: 1;
    }

    .text {
      text-align: center;
      margin-top: 100px;
      animation: fadeInUp 2s ease-in-out forwards;
      animation-delay: 2.2s;
    }

    .text h1 {
      color: #00ffcc;
      font-weight: 700;
      font-size: 2rem;
      line-height: 1.6;
      margin: 0 auto;
      max-width: 90%;
    }

    footer {
      background-color: rgba(51, 51, 51, 0.8);
      color: #fff;
      text-align: center;
      padding: 1rem 0;
      position: fixed;
      bottom: 0;
      width: 100%;
      animation: slideUp 2s ease-in-out;
      z-index: 1;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInLinks {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes floatSubtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .footer-text {
      font-size: 16px;
      font-weight: 400;
    }

    .whatsapp-link {
      text-decoration: none;
      color: #25D366;
      margin-left: 8px;
    }

    .whatsapp-icon {
      vertical-align: middle;
    }

    .footer-whatsapp-link {
      text-decoration: none;
      color: #25D366;
      margin-left: 8px;
    }

    .footer-whatsapp-svg {
      vertical-align: middle;
    }

    .footer-whatsapp-svg svg {
      vertical-align: middle;
    }

    .whatsapp-svg-icon {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="page-wrapper">
    <div class="bgimage">
      <header class="wip-note">
        <h1>🚧 Working on what you need 🚧</h1>
      </header>

      <div class="text">
        <h1>
          Do you want some more new features?</br>
          Then why not tell us what you need?</br>
          DM any of our team members on WhatsApp!</br>
          We will be waiting for your message 🤗</br>
        </h1>
      </div>

      <footer>
        <h2 class="footer-text">
          <a href="https://wa.me/91XXXXXXXXXX" target="_blank" rel="noopener noreferrer" class="footer-whatsapp-link" title="Chat with us on WhatsApp">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="#25D366" viewBox="0 0 24 24" style="vertical-align: middle;">
              <path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.47 3.5 1.35 5.03l-1.42 5.2 5.33-1.4c1.46.79 3.1 1.2 4.7 1.2h.01c5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2zm5.71 14.49c-.23.64-1.31 1.21-1.8 1.29-.46.07-1.05.1-1.7-.1-.39-.12-.88-.29-1.51-.57-2.64-1.15-4.36-3.74-4.5-3.91s-1.07-1.42-1.07-2.72c0-1.3.68-1.95.91-2.21.23-.26.5-.33.67-.33.18 0 .34.01.49.01.16 0 .37-.06.58.44.23.58.78 2.02.85 2.17.07.15.12.33.02.53s-.16.3-.3.46c-.15.17-.3.37-.43.5-.15.15-.3.31-.13.6.18.29.79 1.3 1.7 2.11 1.16 1.03 2.14 1.35 2.43 1.5.29.15.46.13.63-.07.17-.2.73-.85.92-1.15.19-.3.39-.24.66-.14.28.1 1.75.83 2.05.98.3.15.5.22.58.34.08.13.08.74-.15 1.38z"/>
            </svg>
          </a>
          Contact us via WhatsApp for any queries or suggestions!
        </h2>
      </footer>
    </div>
  </div>
</body>
</html>
