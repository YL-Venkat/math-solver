<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Solver - Login</title>
  
  <!-- Montserrat Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="login.css">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="login-box">
    <h2>Math Solver</h2>

    <!-- Email Field -->
    <div class="input-group">
      <input type="email" id="username" placeholder=" " required>
      <label for="username">Email</label>
    </div>

    <!-- Password Field -->
    <div class="input-group">
      <input type="password" id="password" placeholder=" " required>
      <label for="password">Password</label>
    </div>

    <!-- Normal Login Button -->
    <button class="btn" id="loginButton">Login</button>

    <!-- Divider -->
    <div class="divider">OR</div>

    <!-- Google Login Button -->
    <button type="button" class="google-btn" id="googleLoginBtn">
      <span class="google-icon">
        <svg viewBox="0 0 18 18" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.458 2.013.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
      </span>
      <span>Continue with Google</span>
    </button>

    <!-- Footer Links -->
    <div class="footer">
      <p>Forgot password? <a href="reset.html">Reset</a></p>
      <p>New here? <a href="signup.html">Create account</a></p>
    </div>
  </div>

  <!-- Supabase Config Script -->
  <script src="supabase.js"></script>
  <!-- External Logic JS -->
  <script src="login.js"></script>
</body>
</html>
