<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Solver</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.5s ease-in-out;
      overflow: hidden;
    }

    body::before {
      content: "";
      background-image: url('op.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(
        270deg,
        #00f2ff,
        #ff00ff,
        #00ff99,
        #ffcc00
      );
      background-size: 800% 800%;
      color: transparent;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation:
        animatedGradient 6s ease infinite,
        floatUpDown 3s ease-in-out infinite;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
      text-align: center;
    }

    .c1 {
      padding: 60px;
      border-radius: 16px;
      box-shadow:
        0 0 25px rgba(0, 255, 255, 0.3),
        0 0 35px rgba(255, 0, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(0, 0, 0, 0.2);
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .operation-button {
      flex: 1;
      position: relative;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
      text-align: center;
      z-index: 1;
      animation: floatEase 6s ease-in-out infinite alternate;
    }

    .operation-button:hover {
      transform: translateY(-6px) scale(1.04);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25),
        0 0 12px #00f2ff,
        0 0 22px #9b00ff;
      background: linear-gradient(
        90deg,
        #ffffff22,
        #ffffff66,
        #ffffff22
      );
      background-size: 200% auto;
      animation:
        shimmer 1.5s linear infinite,
        floatEase 6s ease-in-out infinite alternate;
      color: white;
    }

    /* Extra button */
    .extra-button-row {
      max-width: 500px;
      margin: 0 auto;
      margin-top: 20px;
    }

    .extra-button-row .operation-button {
      width: 100%;
    }

    /* Lock Screen Overlay Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .modal-card {
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 40px 30px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 255, 0.2);
      color: #ffffff;
    }

    .lock-icon {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
    }

    .modal-card h2 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
      font-weight: 600;
      color: #ffffff;
    }

    .modal-card .sub-text {
      color: #d1d5db;
      font-size: 1.1rem;
      margin: 0 0 10px 0;
      font-weight: 400;
    }

    .modal-card .detail-text {
      color: #9ca3af;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-login {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00f2ff, #9b00ff);
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .btn-close {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #aaa;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-close:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes animatedGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes floatEase {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
  </style>
</head>

<body>

  <div class="c1">

    <h1>Choose a Math Operation</h1>

    <div class="button-row">
      <button type="button" class="operation-button" onclick="navigateTo(event, 'Arithmetic.html')">
        Arithmetic-Operations
      </button>

      <button type="button" class="operation-button" onclick="navigateTo(event, 'conversion.html')">
        Number Conversion
      </button>
    </div>

    <div class="button-row">
      <button type="button" class="operation-button" onclick="navigateTo(event, 'factorial.html')">
        Factorial
      </button>

      <button type="button" class="operation-button" onclick="navigateTo(event, 'prime.html')">
        Prime Check
      </button>
    </div>

    <div class="button-row">
      <button type="button" class="operation-button" onclick="navigateTo(event, 'modexpcalci.html')">
        Modular Exponentiation
      </button>

      <button type="button" class="operation-button" onclick="navigateTo(event, 'euler.html')">
        Euler’s Phi Function
      </button>
    </div>

    <div class="button-row">
      <button type="button" class="operation-button" onclick="navigateTo(event, 'gcd&lcm.html')">
        GCD &amp; LCM
      </button>

      <button type="button" class="operation-button" onclick="navigateTo(event, 'legendre.html')">
        Legendre Symbol \( \left( \frac{a}{p} \right) \)
      </button>
    </div>

    <div class="extra-button-row">
      <button type="button" class="operation-button" onclick="navigateTo(event, 'operations.html')">
        Next Page
      </button>
    </div>

  </div>

  <!-- Content Locked Overlay Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <div class="lock-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>Content locked</h2>
      <p class="sub-text">You don't have access to this content</p>
      <p class="detail-text">Please log in to your account to unlock operations.</p>
      
      <div class="modal-actions">
        <button type="button" class="btn-login" onclick="window.location.href='login.html'">Log In</button>
        <button type="button" class="btn-close" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script>
    // Check authentication state on page load
    async function checkAuthOnLoad() {
      try {
        if (typeof supabaseClient === 'undefined' || !supabaseClient) {
          showModal();
          return;
        }

        const { data, error } = await supabaseClient.auth.getSession();
        if (error || !data || !data.session) {
          showModal();
        }
      } catch (err) {
        console.error("Auth check failed on load:", err);
        showModal();
      }
    }

    // Navigation handler for tool buttons
    async function navigateTo(event, targetPage) {
      if (event) event.preventDefault();

      try {
        if (typeof supabaseClient === 'undefined' || !supabaseClient) {
          showModal();
          return;
        }

        const { data, error } = await supabaseClient.auth.getSession();

        if (error || !data || !data.session) {
          showModal();
        } else {
          window.location.href = targetPage;
        }
      } catch (err) {
        console.error("Auth check failed:", err);
        showModal();
      }
    }

    function showModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('loginModal').style.display = 'none';
    }

    // Run auth check as soon as DOM loads
    document.addEventListener("DOMContentLoaded", checkAuthOnLoad);
  </script>

</body>
</html>
