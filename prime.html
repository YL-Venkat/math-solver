<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prime Number Tool</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      animation: fadeIn 1.2s ease;
    }

    textarea::placeholder, input::placeholder {
      color: #888;
      font-style: italic;
      opacity: 0.9;
      animation: pulsePlaceholder 3s ease-in-out infinite;
    }

    textarea:focus::placeholder, input:focus::placeholder {
      transform: translateX(5px);
      opacity: 0.5;
    }

    @keyframes pulsePlaceholder {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 380px;
      position: relative;
      animation: popIn 0.9s ease-out;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, #00c9ff55, transparent 70%);
      animation: rotateBG 12s linear infinite;
      z-index: 0;
      opacity: 0.1;
    }

    .container * {
      position: relative;
      z-index: 1;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
      animation: floatText 3s ease-in-out infinite;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
      background: #f9f9f9;
      transition: 0.3s ease;
    }

    textarea {
      resize: none;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #00c9ff;
      box-shadow: 0 0 10px #00c9ff55;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .result {
      display: none;
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
      color: #333;
      animation: fadeUp 0.6s ease-in;
      overflow-x: auto;
      max-height: 300px;
      padding: 10px;
      background: #f3f3f3;
      border-radius: 8px;
      text-align: left;
    }

    .error {
      color: red;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes floatText {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rotateBG {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }


    body::before {
      content: "";
      background-image: url('p.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

  </style>
</head>
<body>
  <div class="container">
    <h2>Prime Number Tool</h2>

    <h4>Single Prime Check</h4>
    <textarea id="bigNum" placeholder="Enter a large number..." rows="2"></textarea>
    <button onclick="checkBigPrime()">Check Prime</button>

    <h4>Prime Numbers in Range</h4>
    <input id="startRange" type="text" placeholder="Start number" />
    <input id="endRange" type="text" placeholder="End number" />
    <button onclick="generatePrimeRange()">Show Primes in Range</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    function isBigPrime(n) {
      const num = BigInt(n);
      if (num < 2n) return false;
      if (num === 2n || num === 3n) return true;
      if (num % 2n === 0n || num % 3n === 0n) return false;

      let i = 5n;
      while (i * i <= num) {
        if (num % i === 0n || num % (i + 2n) === 0n) return false;
        i += 6n;
      }
      return true;
    }

    function checkBigPrime() {
      const input = document.getElementById("bigNum").value.trim();
      const resultDiv = document.getElementById("result");

      if (!/^\d+$/.test(input)) {
        resultDiv.innerHTML = `<span class="error">Please enter a valid positive integer.</span>`;
        resultDiv.style.display = "block";
        return;
      }

      const isPrime = isBigPrime(input);
      resultDiv.innerHTML = `<strong>${input}</strong> is ${isPrime ? "<span style='color:green;'>a Prime</span>" : "<span style='color:red;'>not a Prime</span>"}`;
      resultDiv.style.display = "block";
    }

    function generatePrimeRange() {
      const start = document.getElementById("startRange").value.trim();
      const end = document.getElementById("endRange").value.trim();
      const resultDiv = document.getElementById("result");

      if (!/^\d+$/.test(start) || !/^\d+$/.test(end)) {
        resultDiv.innerHTML = `<span class="error">Please enter valid start and end numbers.</span>`;
        resultDiv.style.display = "block";
        return;
      }

      let startNum = BigInt(start);
      const endNum = BigInt(end);
      if (startNum > endNum) {
        resultDiv.innerHTML = `<span class="error">Start number must be less than or equal to end number.</span>`;
        resultDiv.style.display = "block";
        return;
      }

      const primes = [];
      const maxCount = 10000n;
      let count = 0n;

      while (startNum <= endNum && count < maxCount) {
        if (isBigPrime(startNum)) {
          primes.push(startNum.toString());
        }
        startNum++;
        count++;
      }

      resultDiv.innerHTML = `<strong>Primes in range:</strong><br>${primes.length ? primes.join(', ') : '<i>No primes found</i>'}`;
      resultDiv.style.display = "block";
    }
  </script>
</body>
</html>
