<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: black;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.85);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      text-align: center;
      border: 3px solid #0ff;
      animation: boxGlow 5s linear infinite;
    }

    @keyframes boxGlow {
      0%   { border-color: #0ff; }
      25%  { border-color: #0f0; }
      50%  { border-color: #ff0; }
      75%  { border-color: #f0f; }
      100% { border-color: #0ff; }
    }

    .slide {
      display: none;
    }

    .slide.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    h2 {
      font-size: 30px;
      margin-bottom: 20px;
      animation: colorChange 4s infinite;
      text-shadow: 0 0 10px currentColor;
    }

    .info-item {
      margin-bottom: 20px;
    }

    .info-item h4 {
      margin: 0;
      font-size: 18px;
      animation: colorChange 4s infinite;
      text-shadow: 0 0 5px currentColor;
    }

    .info-item p {
      margin: 5px 0 0;
      color: #ccc;
      text-shadow: 0 0 4px #888;
    }

    @keyframes colorChange {
      0%   { color: #0ff; }
      25%  { color: #0f0; }
      50%  { color: #ff0; }
      75%  { color: #f0f; }
      100% { color: #0ff; }
    }

    form input, form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #0ff;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 15px;
    }

    form textarea {
      resize: vertical;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #0ff;
      color: black;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #00ccff;
      box-shadow: 0 0 10px #00ccff, 0 0 20px #00ccff;
    }
  </style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <div class="content">
    <div class="slide active" id="slide1">
      <h2>Contact Us</h2>
      <div class="info-item">
        <h4>Email</h4>
        <p>name@gmail.com</p>
      </div>
      <div class="info-item">
        <h4>Phone</h4>
        <p>+91 XXXXX XXXXX</p>
      </div>
      <div class="info-item">
        <h4>Address</h4>
        <p>You know where we are</p>
      </div>
    </div>

    <div class="slide" id="slide2">
      <h2>Send a Message</h2>
      <form>
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Email" required />
        <textarea rows="4" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>
  <script>
    // === SLIDESHOW LOGIC ===
    const slides = document.querySelectorAll('.slide');
    let current = 0;
    let slideInterval;
  
    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.remove('active');
        if (i === index) {
          void slide.offsetWidth; // reflow to trigger animation
          slide.classList.add('active');
        }
      });
    }
  
    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }
  
    function startSlideshow() {
      slideInterval = setInterval(nextSlide, 6000);
    }
  
    function stopSlideshow() {
      clearInterval(slideInterval);
    }
  
    // Start initially
    showSlide(current);
    startSlideshow();
  
    // Pause/resume slideshow on input focus/blur
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach(input => {
      input.addEventListener('focus', stopSlideshow);
      input.addEventListener('blur', () => {
        // Check if any field is still focused before resuming
        const anyFocused = Array.from(inputs).some(field => field === document.activeElement);
        if (!anyFocused) startSlideshow();
      });
    });
  
  
    // === MATRIX RAIN ===
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
  
    let letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("");
    let fontSize = 14;
    let columns;
    let drops;
  
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
    }
  
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
  
    let colors = ['#0ff', '#0f0', '#ff0', '#f0f'];
    let colorIndex = 0;
  
    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
  
      ctx.fillStyle = colors[colorIndex];
      ctx.font = fontSize + "px monospace";
  
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
  
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
  
    setInterval(draw, 40);
    setInterval(() => {
      colorIndex = (colorIndex + 1) % colors.length;
    }, 2000);
  </script>
  
  
</body>
</html>
