<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prime Factorization Tool</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      animation: fadeIn 1.2s ease;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 380px;
      position: relative;
      animation: popIn 0.9s ease-out;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, #00c9ff55, transparent 70%);
      animation: rotateBG 12s linear infinite;
      z-index: 0;
      opacity: 0.1;
    }

    .container * {
      position: relative;
      z-index: 1;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
    }

    textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
      background: #f9f9f9;
      transition: 0.3s ease;
      resize: none;
    }

    textarea::placeholder {
      color: #888;
      font-style: italic;
      opacity: 0.9;
      animation: pulsePlaceholder 3s ease-in-out infinite;
    }

    textarea:focus::placeholder {
      transform: translateX(5px);
      opacity: 0.5;
    }

    textarea:focus {
      outline: none;
      border-color: #00c9ff;
      box-shadow: 0 0 10px #00c9ff55;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .result {
      display: none;
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
      color: #333;
      animation: fadeUp 0.6s ease-in;
      overflow-x: auto;
      max-height: 300px;
      padding: 10px;
      background: #f3f3f3;
      border-radius: 8px;
      text-align: left;
    }

    .error {
      color: red;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rotateBG {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulsePlaceholder {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    body::before {
      content: "";
      background-image: url('p.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Prime Factorization Tool</h2>
    <textarea id="inputNumber" placeholder="Enter a large composite number..." rows="2"></textarea>
    <button onclick="factorize()">Factorize</button>
    <div id="result" class="result"></div>
  </div>

  <script>
    function isPrime(n) {
      if (n < 2n) return false;
      if (n === 2n || n === 3n) return true;
      if (n % 2n === 0n || n % 3n === 0n) return false;
      for (let i = 5n; i * i <= n; i += 6n) {
        if (n % i === 0n || n % (i + 2n) === 0n) return false;
      }
      return true;
    }

    function primeFactorization(n) {
      const num = BigInt(n);
      const factors = [];
      let current = num;
      let divisor = 2n;

      while (divisor * divisor <= current) {
        while (current % divisor === 0n) {
          factors.push(divisor.toString());
          current /= divisor;
        }
        divisor++;
      }

      if (current > 1n) {
        factors.push(current.toString());
      }

      return factors;
    }

    function factorize() {
      const input = document.getElementById("inputNumber").value.trim();
      const resultDiv = document.getElementById("result");

      if (!/^\d+$/.test(input)) {
        resultDiv.innerHTML = `<span class="error">Please enter a valid positive integer.</span>`;
        resultDiv.style.display = "block";
        return;
      }

      const num = BigInt(input);

      if (isPrime(num)) {
        resultDiv.innerHTML = `<strong>${num}</strong> is <span style="color: green;">a prime number</span>.`;
      } else {
        const factors = primeFactorization(num);
        resultDiv.innerHTML = `<strong>Prime factorization of ${num}:</strong><br>${factors.join(" × ")}`;
      }

      resultDiv.style.display = "block";
    }
  </script>
</body>
</html>
