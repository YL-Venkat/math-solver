<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Math Solver - Reset Password</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>

    /* =========================
       GENERAL
       ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;

      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      background: #111;
    }


    /* =========================
       BACKGROUND
       ========================= */

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      background:
        linear-gradient(
          rgba(10, 10, 20, 0.55),
          rgba(10, 10, 20, 0.65)
        ),
        url("ms.jpg");

      background-size: cover;
      background-position: center;

      z-index: -2;
    }


    /* =========================
       RESET BOX
       ========================= */

    .reset-box {

      width: 360px;

      padding: 40px;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.12);

      border: 1px solid rgba(255, 255, 255, 0.25);

      -webkit-backdrop-filter: blur(15px);
      backdrop-filter: blur(15px);

      box-shadow:
        0 0 20px rgba(0, 242, 255, 0.25),
        0 0 40px rgba(255, 0, 212, 0.15);

      animation: zoomIn 1s ease;

      position: relative;
    }


    /* =========================
       TITLE
       ========================= */

    .reset-box h2 {

      text-align: center;

      margin-bottom: 15px;

      font-size: 28px;

      font-weight: 700;

      background: linear-gradient(
        90deg,
        #00f5ff,
        #008cff,
        #7a2cff,
        #ff00d4,
        #00f5ff
      );

      background-size: 400% 100%;

      color: transparent;

      -webkit-background-clip: text;
      background-clip: text;

      animation: mathColors 5s linear infinite;
    }


    /* =========================
       DESCRIPTION
       ========================= */

    .description {

      text-align: center;

      color: rgba(255, 255, 255, 0.75);

      font-size: 13px;

      line-height: 1.6;

      margin-bottom: 30px;
    }


    /* =========================
       INPUT
       ========================= */

    .input-group {

      position: relative;

      margin-bottom: 30px;
    }


    .input-group input {

      width: 100%;

      padding: 13px 10px;

      background: rgba(255, 255, 255, 0.08);

      border: none;

      border-bottom: 2px solid rgba(255, 255, 255, 0.5);

      border-radius: 5px 5px 0 0;

      color: white;

      font-size: 15px;

      outline: none;

      transition: 0.3s;
    }


    .input-group input:focus {

      border-bottom-color: #00f5ff;

      box-shadow:
        0 5px 15px rgba(0, 245, 255, 0.2);
    }


    /* =========================
       FLOATING LABEL
       ========================= */

    .input-group label {

      position: absolute;

      left: 10px;

      top: 50%;

      transform: translateY(-50%);

      color: rgba(255, 255, 255, 0.7);

      font-size: 13px;

      pointer-events: none;

      transition: 0.3s;
    }


    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {

      top: -9px;

      font-size: 11px;

      color: #00f5ff;
    }


    /* =========================
       RESET BUTTON
       ========================= */

    .btn {

      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 30px;

      background: linear-gradient(
        90deg,
        #00f5ff,
        #008cff,
        #7a2cff,
        #ff00d4
      );

      background-size: 300% 100%;

      color: white;

      font-family: 'Montserrat', sans-serif;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      animation:
        buttonGradient 4s linear infinite,
        glowPulse 2s ease-in-out infinite;

      transition: transform 0.3s;
    }


    .btn:hover {

      transform: scale(1.04);
    }


    /* =========================
       FOOTER
       ========================= */

    .footer {

      text-align: center;

      margin-top: 25px;

      font-size: 12px;

      color: rgba(255, 255, 255, 0.7);

      line-height: 2;
    }


    .footer a {

      color: #00f5ff;

      text-decoration: none;

      font-weight: 600;

      transition: 0.3s;
    }


    .footer a:hover {

      color: #ff00d4;

      text-shadow:
        0 0 10px #ff00d4;
    }


    /* =========================
       ANIMATIONS
       ========================= */

    @keyframes zoomIn {

      from {
        transform: scale(0.7);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }

    }


    @keyframes mathColors {

      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }

    }


    @keyframes buttonGradient {

      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }

    }


    @keyframes glowPulse {

      0%,
      100% {
        box-shadow:
          0 0 10px rgba(0, 245, 255, 0.5);
      }

      50% {
        box-shadow:
          0 0 20px rgba(0, 245, 255, 0.7),
          0 0 35px rgba(255, 0, 212, 0.4);
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 500px) {

      .reset-box {

        width: 90%;

        padding: 30px;
      }

    }

  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

  <div class="reset-box">

    <h2>Reset Password</h2>

    <p class="description">
      Enter your email address and we'll send you a link to reset your password.
    </p>


    <div class="input-group">

      <input
        type="email"
        id="email"
        placeholder=" "
        required>

      <label for="email">
        Email Address
      </label>

    </div>


    <button class="btn">
      Send Reset Link
    </button>


    <div class="footer">

      <p>
        Remember your password?
        <a href="login.html">Back to Login</a>
      </p>

    </div>

  </div>
<script src="supabase.js"></script>

<script>
  const resetButton = document.querySelector(".btn");

  resetButton.addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();

    if (!email) {
      alert("Please enter your email address.");
      return;
    }

    resetButton.disabled = true;
    resetButton.textContent = "Sending...";

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin + "/update-password.html"
        }
      );

    if (error) {

      alert(error.message);

      resetButton.disabled = false;
      resetButton.textContent = "Send Reset Link";

      return;
    }

    alert(
      "If an account exists for this email, " +
      "a password reset link has been sent."
    );

    resetButton.disabled = false;
    resetButton.textContent = "Send Reset Link";
  });
</script>
</body>

</html>
