<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Math Solver</title>

  <link rel="stylesheet" href="a.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .modal-card {
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 40px 30px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 255, 0.2);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
    }

    .lock-icon {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
    }

    .modal-card h2 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
      font-weight: 600;
      color: #ffffff;
    }

    .modal-card .sub-text {
      color: #d1d5db;
      font-size: 1.1rem;
      margin: 0 0 10px 0;
      font-weight: 400;
    }

    .modal-card .detail-text {
      color: #9ca3af;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-login {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00f2ff, #9b00ff);
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .btn-close {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #aaa;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-close:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="bgimage">

    <header>
      <div class="navbar">
        <div class="brand">
          <img src="log.png" alt="Math Solver Logo">
          <h1>Math Solver</h1>
        </div>

        <nav>
          <a href="operation.html" id="operationsLink">Operations</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a href="contact.html">Contact</a>

          <!-- LOGIN BUTTON -->
          <button class="login-btn" id="loginBtn" onclick="window.location.href='login.html'">
            Login
          </button>

          <div class="profile-container" id="profileContainer">

            <button class="profile-btn" id="profileBtn">
              <span id="profileInitial">U</span>
            </button>

            <div class="profile-dropdown" id="profileDropdown">

              <div class="profile-email" id="profileEmail">
                user@email.com
              </div>

              <div class="dropdown-divider"></div>

              <button class="dropdown-item" onclick="window.location.href='profile.html'">
                Profile
              </button>
              <button class="dropdown-item logout-item" id="logoutBtn">
                Logout
              </button>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <footer>
      <p>
        No need to worry - we're here to make math easy for you!
      </p>
    </footer>

  </div>

  <!-- Content Locked Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <div class="lock-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>Content locked</h2>
      <p class="sub-text">You don't have access to this content</p>
      <p class="detail-text">Please log in to access math operations.</p>
      
      <div class="modal-actions">
        <button type="button" class="btn-login" onclick="window.location.href='login.html'">Log In</button>
        <button type="button" class="btn-close" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Supabase Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const loginBtn = document.getElementById("loginBtn");
    const profileContainer = document.getElementById("profileContainer");
    const profileBtn = document.getElementById("profileBtn");
    const profileDropdown = document.getElementById("profileDropdown");
    const profileEmail = document.getElementById("profileEmail");
    const profileInitial = document.getElementById("profileInitial");
    const logoutBtn = document.getElementById("logoutBtn");
    const operationsLink = document.getElementById("operationsLink");
    const loginModal = document.getElementById("loginModal");

    // Modal Control
    function showModal() {
      loginModal.style.display = "flex";
    }

    function closeModal() {
      loginModal.style.display = "none";
    }

    // Render Navbar UI depending on Auth state
    function renderUserUI(user) {
      if (user) {
        loginBtn.style.display = "none";
        profileContainer.style.display = "block";
        profileEmail.textContent = user.email || "";

        const avatarUrl = user.user_metadata?.avatar_url;

        if (avatarUrl) {
          profileBtn.style.backgroundImage = `url("${avatarUrl}")`;
          profileBtn.style.backgroundSize = "cover";
          profileBtn.style.backgroundPosition = "center";
          profileBtn.style.backgroundRepeat = "no-repeat";
          profileInitial.textContent = "";
        } else {
          profileBtn.style.backgroundImage = "";
          const initial = user.email ? user.email.charAt(0).toUpperCase() : "U";
          profileInitial.textContent = initial;
        }
      } else {
        loginBtn.style.display = "inline-block";
        profileContainer.style.display = "none";
      }
    }

    // Check user session state
    async function checkUser() {
      if (!supabaseClient) return;

      const { data: { session }, error } = await supabaseClient.auth.getSession();

      if (error) {
        console.error("Session error:", error);
        return;
      }

      renderUserUI(session?.user || null);
    }

    // Initialize Check
    checkUser();

    // Auto-detect auth changes
    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((_event, session) => {
        renderUserUI(session?.user || null);
      });
    }

    // Profile Dropdown Toggle
    profileBtn.addEventListener("click", function (event) {
      event.stopPropagation();
      profileDropdown.classList.toggle("show");
    });

    document.addEventListener("click", function (event) {
      if (!profileContainer.contains(event.target)) {
        profileDropdown.classList.remove("show");
      }
    });

    // Logout Handling
    logoutBtn.addEventListener("click", async function () {
      console.log("Logging out...");

      if (supabaseClient) {
        const { error } = await supabaseClient.auth.signOut({ scope: "local" });
        if (error) {
          console.error("Supabase logout failed:", error);
          localStorage.clear();
          sessionStorage.clear();
        }
      }

      window.location.href = "index.html";
    });

    // Intercept Operations Click
    operationsLink.addEventListener("click", async function (event) {
      event.preventDefault();

      let session = null;
      if (supabaseClient) {
        const { data } = await supabaseClient.auth.getSession();
        session = data?.session || null;
      }

      if (session && session.user) {
        window.location.href = "operation.html";
      } else {
        showModal();
      }
    });
  </script>

</body>

</html>
