<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Math Solver</title>

  <link rel="stylesheet" href="a.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="ag.js"></script>
</head>

<body>

  <div class="bgimage">

    <!-- =========================
         HEADER
    ========================== -->
    <header>
      <div class="navbar">

        <div class="brand">
          <img src="log.png" alt="Math Solver Logo">
          <h1>Math Solver</h1>
        </div>

        <nav>

          <a href="operation.html" id="operationsLink">
            Operations
          </a>

          <a href="about.html">
            About
          </a>

          <a href="services.html">
            Services
          </a>

          <a href="contact.html">
            Contact
          </a>

          <!-- LOGIN BUTTON -->
          <button
            class="login-btn"
            id="loginBtn"
            onclick="window.location.href='login.html'">
            Login
          </button>

          <!-- PROFILE -->
          <div class="profile-container" id="profileContainer">

            <button class="profile-btn" id="profileBtn">
              <span id="profileInitial">U</span>
            </button>

            <div class="profile-dropdown" id="profileDropdown">

              <div class="profile-email" id="profileEmail">
                user@email.com
              </div>

              <div class="dropdown-divider"></div>

              <button
                class="dropdown-item"
                onclick="window.location.href='profile.html'">
                Profile
              </button>

              <button
                class="dropdown-item logout-item"
                id="logoutBtn">
                Logout
              </button>

            </div>

          </div>

        </nav>

      </div>
    </header>


    <!-- =========================
         HELP BOT
    ========================== -->

    <div class="help-bot">

      <!-- Bot Chat Window -->
      <div class="bot-window" id="botWindow">

        <!-- Bot Header -->
        <div class="bot-header">

          <div class="bot-title">

            <div class="bot-avatar-small">
              🤖
            </div>

            <div>
              <h3>Math Assistant</h3>
              <span>
                <i></i> Online
              </span>
            </div>

          </div>

          <button
            class="bot-close"
            id="botClose">
            ×
          </button>

        </div>


        <!-- Chat Messages -->
        <div class="bot-messages" id="botMessages">

          <div class="bot-message">
            👋 Hi! Welcome to <strong>Math Solver</strong>!
            <br><br>
            I'm your virtual assistant. I can help you understand how to use this website.
          </div>

          <div class="bot-message">
            What would you like to know?
          </div>

        </div>


        <!-- Quick Questions -->
        <div class="bot-questions" id="botQuestions">

          <button data-question="operations">
            🧮 How to use Operations?
          </button>

          <button data-question="login">
            🔐 Why do I need Login?
          </button>

          <button data-question="website">
            🌐 What can I do here?
          </button>

          <button data-question="navigation">
            🧭 Where should I go?
          </button>

        </div>

      </div>


      <!-- Floating Bot Button -->
      <button
        class="bot-button"
        id="botButton"
        aria-label="Open Math Assistant">

        <span class="bot-icon">
          🤖
        </span>

        <span class="bot-notification">
          1
        </span>

      </button>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>
      <p>
        No need to worry - we're here to make math easy for you!
      </p>
    </footer>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /* =========================================
       EXISTING NAVBAR ELEMENTS
    ========================================= */

    const loginBtn = document.getElementById("loginBtn");
    const profileContainer = document.getElementById("profileContainer");
    const profileBtn = document.getElementById("profileBtn");
    const profileDropdown = document.getElementById("profileDropdown");
    const profileEmail = document.getElementById("profileEmail");
    const profileInitial = document.getElementById("profileInitial");
    const logoutBtn = document.getElementById("logoutBtn"); // Typo fixed here!
    const operationsLink = document.getElementById("operationsLink");


    /* =========================================
       RENDER NAVBAR UI
    ========================================= */

    function renderUserUI(user) {
      if (user) {
        if (loginBtn) loginBtn.style.display = "none";
        if (profileContainer) profileContainer.style.display = "block";
        if (profileEmail) profileEmail.textContent = user.email || "";

        const avatarUrl = user.user_metadata?.avatar_url;

        if (profileBtn) {
          if (avatarUrl) {
            profileBtn.style.backgroundImage = `url("${avatarUrl}")`;
            profileBtn.style.backgroundSize = "cover";
            profileBtn.style.backgroundPosition = "center";
            profileBtn.style.backgroundRepeat = "no-repeat";
            if (profileInitial) profileInitial.textContent = "";
          } else {
            profileBtn.style.backgroundImage = "";
            const initial = user.email ? user.email.charAt(0).toUpperCase() : "U";
            if (profileInitial) profileInitial.textContent = initial;
          }
        }
      } else {
        if (loginBtn) loginBtn.style.display = "inline-block";
        if (profileContainer) profileContainer.style.display = "none";
      }
    }


    /* =========================================
       CHECK USER SESSION
    ========================================= */

    async function checkUser() {
      if (typeof supabaseClient === "undefined" || !supabaseClient) {
        return;
      }

      const { data: { session }, error } = await supabaseClient.auth.getSession();

      if (error) {
        console.error("Session error:", error);
        return;
      }

      renderUserUI(session?.user || null);
    }

    checkUser();


    /* =========================================
       AUTH STATE CHANGE
    ========================================= */

    if (typeof supabaseClient !== "undefined" && supabaseClient) {
      supabaseClient.auth.onAuthStateChange((_event, session) => {
        renderUserUI(session?.user || null);
      });
    }


    /* =========================================
       PROFILE DROPDOWN
    ========================================= */

    if (profileBtn && profileDropdown) {
      profileBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        profileDropdown.classList.toggle("show");
      });
    }

    document.addEventListener("click", function (event) {
      if (profileContainer && profileDropdown && !profileContainer.contains(event.target)) {
        profileDropdown.classList.remove("show");
      }
    });


    /* =========================================
       LOGOUT
    ========================================= */

    if (logoutBtn) {
      logoutBtn.addEventListener("click", async function () {
        console.log("Logging out...");
        logoutBtn.textContent = "Logging out...";
        logoutBtn.disabled = true;

        if (typeof supabaseClient !== "undefined" && supabaseClient) {
          const { error } = await supabaseClient.auth.signOut({ scope: "local" });

          if (error) {
            console.error("Supabase logout failed:", error);
            localStorage.clear();
            sessionStorage.clear();
          }
        }

        window.location.href = "index.html";
      });
    }


    /* =========================================
       OPERATIONS AUTH GUARD
    ========================================= */

    if (operationsLink) {
      operationsLink.addEventListener("click", async function (event) {
        event.preventDefault();

        let session = null;

        if (typeof supabaseClient !== "undefined" && supabaseClient) {
          const { data } = await supabaseClient.auth.getSession();
          session = data?.session || null;
        }

        if (session && session.user) {
          window.location.href = "operation.html";
        } else {
          if (typeof showAuthGuardModal === "function") {
            showAuthGuardModal();
          } else {
            const agModal = document.getElementById("authGuardModal");
            if (agModal) {
              agModal.style.display = "flex";
            }
          }
        }
      });
    }


    /* =========================================
       MATH ASSISTANT BOT
    ========================================= */

    const botButton = document.getElementById("botButton");
    const botWindow = document.getElementById("botWindow");
    const botClose = document.getElementById("botClose");
    const botMessages = document.getElementById("botMessages");
    const botQuestions = document.getElementById("botQuestions");


    /* =========================================
       OPEN BOT
    ========================================= */

    if (botButton && botWindow) {
      botButton.addEventListener("click", function () {
        botWindow.classList.add("active");
        botButton.classList.add("hidden");

        const notification = document.querySelector(".bot-notification");
        if (notification) {
          notification.style.display = "none";
        }
      });
    }


    /* =========================================
       CLOSE BOT
    ========================================= */

    if (botClose && botWindow && botButton) {
      botClose.addEventListener("click", function () {
        botWindow.classList.remove("active");
        botButton.classList.remove("hidden");
      });
    }


    /* =========================================
       ADD USER MESSAGE
    ========================================= */

    function addUserMessage(text) {
      if (!botMessages) return;
      const message = document.createElement("div");
      message.className = "user-message";
      message.textContent = text;
      botMessages.appendChild(message);
      scrollBotToBottom();
    }


    /* =========================================
       ADD BOT MESSAGE
    ========================================= */

    function addBotMessage(text) {
      if (!botMessages) return;
      const message = document.createElement("div");
      message.className = "bot-message";
      message.innerHTML = text;
      botMessages.appendChild(message);
      scrollBotToBottom();
    }


    /* =========================================
       SCROLL CHAT
    ========================================= */

    function scrollBotToBottom() {
      if (botMessages) {
        botMessages.scrollTop = botMessages.scrollHeight;
      }
    }


    /* =========================================
       BOT RESPONSES
    ========================================= */

    const botResponses = {
      operations: `
        🧮 <strong>Operations</strong> is where you can solve mathematical problems.
        <br><br>
        Click <strong>Operations</strong> in the navigation bar.
        <br><br>
        🔐 You need to be logged in to access it.
        <br><br>
        Once you're logged in, you'll be taken to the Operations page where you can use the available math-solving features.
      `,

      login: `
        🔐 <strong>Login</strong> allows you to access protected features of Math Solver.
        <br><br>
        You need to log in before using the <strong>Operations</strong> section.
        <br><br>
        If you're already logged in, the Login button will be replaced with your profile icon.
      `,

      website: `
        🌐 <strong>Math Solver</strong> is designed to make mathematical problem solving easier.
        <br><br>
        You can explore the website using:
        <br><br>
        🧮 <strong>Operations</strong> – Solve math problems
        <br>
        📖 <strong>About</strong> – Learn about the project
        <br>
        ⚙️ <strong>Services</strong> – Explore available services
        <br>
        📩 <strong>Contact</strong> – Get in touch
      `,

      navigation: `
        🧭 Here's a quick guide:
        <br><br>
        <strong>1.</strong> Start by logging in.
        <br><br>
        <strong>2.</strong> Go to <strong>Operations</strong> to use the math solver.
        <br><br>
        <strong>3.</strong> Use <strong>About</strong> to understand the project.
        <br><br>
        <strong>4.</strong> Check <strong>Services</strong> for available features.
        <br><br>
        <strong>5.</strong> Use <strong>Contact</strong> if you need to reach us.
      `
    };


    /* =========================================
       HANDLE QUESTIONS
    ========================================= */

    document.querySelectorAll(".bot-questions button").forEach(button => {
      button.addEventListener("click", function () {
        const questionType = this.dataset.question;
        const questionText = this.textContent.trim();

        addUserMessage(questionText);

        setTimeout(function () {
          addBotMessage(botResponses[questionType]);
        }, 400);
      });
    });


    /* =========================================
       BOT BUTTON KEYBOARD SUPPORT
    ========================================= */

    if (botButton) {
      botButton.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          botButton.click();
        }
      });
    }

  </script>

</body>

</html>
